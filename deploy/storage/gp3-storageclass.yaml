# Default StorageClass so PVCs without an explicit class provision gp3 EBS volumes
# through the aws-ebs-csi-driver addon. WaitForFirstConsumer binds the volume in
# the same AZ as the pod that uses it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
parameters:
  type: gp3
