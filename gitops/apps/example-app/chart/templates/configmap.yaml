apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "example-app.fullname" . }}
  labels:
    {{- include "example-app.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PORT: {{ .Values.service.targetPort | quote }}
  APP_VERSION: {{ .Values.image.tag | quote }}
