replicaCount: 2

# ArgoCD overrides repository and tag with Helm parameters taken from
# gitops/environments/<env>/environment.json (exampleApp.image). These defaults
# only exist so `helm lint` and `helm template` work without an environment.
image:
  repository: "example-app"
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}
  automountServiceAccountToken: false

# Consumed by app/main.py. PORT is not listed here: it is rendered from
# service.targetPort so the container port and the app agree by construction.
config:
  appEnv: "dev"
  logLevel: "INFO"

# Must match exampleApp.secretName in environment.json: that is the Kubernetes
# Secret the ExternalSecret creates.
secret:
  name: example-app

service:
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: alb
  host: ""
  certificateArn: ""
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# Keep at most one pod down during voluntary disruptions (node drains, upgrades,
# autoscaler consolidation). maxUnavailable pairs better with the HPA than a
# fixed minAvailable, which can block scale-down.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

metrics:
  enabled: true
  path: /metrics
