# Dev environment values consumed by the ArgoCD Application.
# Git is the source of truth: ArgoCD renders the chart with this file.
#
# image.repository and image.tag are NOT set here. They come from
# gitops/environments/dev/environment.json (exampleApp.image), written by
# `make configure-gitops-values ENV=dev` and `make set-image-tag ENV=dev TAG=...`.
#
# Dev baseline:
# - no custom domain
# - no ACM certificate
# - public app URL is the AWS-generated ALB DNS name over HTTP
#
# Keep ingress.host and ingress.certificateArn empty for this mode.

workload:
  mode: stateless

ingress:
  # Empty means the ALB accepts requests for its generated DNS name.
  certificateArn: ""
  # Empty means no host rule is rendered.
  host: ""

config:
  appEnv: "dev"
  logLevel: "DEBUG"
