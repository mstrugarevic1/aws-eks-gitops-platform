apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "staging-observability-manifests"
  namespace: "argocd"
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - "resources-finalizer.argocd.argoproj.io"
spec:
  project: "default"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "observability"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
  source:
    repoURL: "git@github.com:mstrugarevic1/eks-gitops-platform.git"
    targetRevision: "main"
    path: "deploy/observability"
    directory:
      include: "{grafana-dashboard-*.yaml,grafana-datasources.yaml}"
