apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "staging-storageclass"
  namespace: "argocd"
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
  finalizers:
    - "resources-finalizer.argocd.argoproj.io"
spec:
  project: "default"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "kube-system"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  source:
    repoURL: "git@github.com:mstrugarevic1/eks-gitops-platform.git"
    targetRevision: "main"
    path: "deploy/storage"
