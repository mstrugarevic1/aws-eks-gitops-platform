apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "staging-root"
  namespace: "argocd"
  finalizers:
    - "resources-finalizer.argocd.argoproj.io"
spec:
  project: "default"
  source:
    repoURL: "git@github.com:mstrugarevic1/eks-argocd-platform-boilerplate.git"
    targetRevision: "main"
    path: "gitops/environments/staging/apps"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
