apiVersion: "argoproj.io/v1alpha1"
kind: "Application"
metadata:
  name: "production-external-secrets-manifests"
  namespace: "argocd"
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - "resources-finalizer.argocd.argoproj.io"
spec:
  project: "default"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "example-app"
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - "CreateNamespace=true"
  source:
    repoURL: "git@github.com:mstrugarevic1/eks-gitops-platform.git"
    targetRevision: "main"
    path: "gitops/environments/production/manifests/external-secrets"
