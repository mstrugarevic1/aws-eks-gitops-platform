apiVersion: "external-secrets.io/v1"
kind: "ClusterSecretStore"
metadata:
  name: "production-aws-secretsmanager"
spec:
  provider:
    aws:
      service: "SecretsManager"
      region: "us-east-1"
      auth:
        jwt:
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
---
apiVersion: "external-secrets.io/v1"
kind: "ExternalSecret"
metadata:
  name: "example-app"
  namespace: "example-app"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: "production-aws-secretsmanager"
    kind: "ClusterSecretStore"
  target:
    name: "example-app"
    creationPolicy: "Owner"
  dataFrom:
    -
      extract:
        key: "my-platform/production/example-app"
