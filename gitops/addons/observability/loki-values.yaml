deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi

backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

test:
  enabled: false

# The memcached caches default to multi-GB memory requests and do not fit the dev
# nodes; they are not needed for a single-binary dev setup.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Canary is a test DaemonSet; disable it to save pod slots on small nodes.
lokiCanary:
  enabled: false
