name: Checks

on:
  pull_request:
  push:
    branches: ["main"]

# Read-only by default. No job here needs to write to the repository.
permissions:
  contents: read

jobs:
  # The list of environments lives in one place; every matrix below reads it.
  discover:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.read.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        run: |
          envs="$(python3 -c 'import json; print(json.dumps(json.load(open("gitops/environments/environments.json"))["environments"]))')"
          echo "environments=${envs}" >> "$GITHUB_OUTPUT"

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive terraform

      # -backend=false keeps this offline: no S3 bucket, no AWS credentials.
      - name: terraform init
        run: terraform -chdir=terraform/stack init -backend=false

      - name: terraform validate
        run: terraform -chdir=terraform/stack validate

      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --minimum-failure-severity=error

  terraform-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: terraform init
        run: terraform -chdir=terraform/foundation init -backend=false
      - name: terraform validate
        run: terraform -chdir=terraform/foundation validate

  # Checkov only. Trivy config scanning would report most of the same findings
  # a second time under different IDs.
  terraform-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install checkov==3.2.334
      - name: checkov
        run: checkov --config-file .checkov.yml

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bootstrap/*.sh scripts/*.sh
      - name: shfmt
        run: |
          curl -fsSL -o /tmp/shfmt https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          chmod +x /tmp/shfmt
          /tmp/shfmt -d -i 2 -ci bootstrap/*.sh scripts/*.sh

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - name: py_compile
        run: python -m py_compile scripts/gitops.py scripts/check-doc-links.py app/main.py
      - name: ruff
        run: ruff check .
      - name: unit tests
        run: python -m unittest discover -s tests -v

  gitops:
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: JSON is parseable
        run: |
          for file in $(git ls-files '*.json'); do
            python3 -m json.tool "$file" >/dev/null
          done

      # ArgoCD reconciles what is committed, so the rendered manifests must
      # match what the renderer produces from the committed configuration.
      - name: rendered manifests are up to date
        run: |
          for env in $(echo '${{ needs.discover.outputs.environments }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            python3 scripts/gitops.py render "$env"
          done
          git diff --exit-code -- gitops

  kubernetes:
    runs-on: ubuntu-latest
    needs: discover
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: helm lint
        run: helm lint gitops/apps/example-app/chart

      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /tmp kubeconform
          sudo mv /tmp/kubeconform /usr/local/bin/

      # CRD schemas (ArgoCD Application, ExternalSecret, VMServiceScrape) come
      # from the community catalog, so no cluster is needed.
      - name: validate rendered manifests
        run: |
          mkdir -p /tmp/rendered
          for env in $(echo '${{ needs.discover.outputs.environments }}' | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)))'); do
            helm template example-app gitops/apps/example-app/chart \
              --values "gitops/apps/example-app/chart/values-${env}.yaml" \
              --set image.repository=123456789012.dkr.ecr.us-east-1.amazonaws.com/example-app \
              --set image.tag=0.1.0 \
              > "/tmp/rendered/${env}-example-app.yaml"
          done
          kubeconform \
            -strict \
            -summary \
            -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rendered \
            gitops/environments/*/root-app.yaml \
            gitops/environments/*/apps/*.yaml

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, which needs more than a shallow clone.
          fetch-depth: 0

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.14.0 "**/*.md"

      - name: documentation links resolve
        run: python3 scripts/check-doc-links.py

      - name: gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact
